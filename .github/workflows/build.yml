name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk fingerboard-camera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fingerboard-camera-apk
          path: fingerboard-camera.apk

      - name: Publicar na página de downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-log --yes --cleanup-tag || true
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest fingerboard-camera.apk \
            --title "Fingerboard Camera · build ${{ github.run_number }}" \
            --notes "Baixe o fingerboard-camera.apk abaixo e instale no celular. Commit: ${{ github.sha }}" \
            --target "${{ github.sha }}"

      - name: Publicar log do erro
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build.log --prerelease \
            --title "Log do build que falhou (${{ github.run_number }})" \
            --notes "Log da compilação que deu erro." \
            --target "${{ github.sha }}"
